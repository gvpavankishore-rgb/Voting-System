<!DOCTYPE html>
<html>
<head>
<title>Vote Success</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#1e3c72,#2a5298,#0f2027,#203a43);
    background-size:400% 400%;
    animation:bgmove 10s ease infinite;
}

.container{
    text-align:center;
    color:white;
    animation:popup 0.8s ease;
}

.tick{
    font-size:100px;
    color:#00ff88;
    animation:tickanim 1s infinite alternate;
}

.party-img{
    width:180px;
    height:180px;
    object-fit:contain;
    margin:20px 0;
    border-radius:15px;
    background:white;
    padding:10px;
    animation:float 2s ease-in-out infinite;
}

h1{
    font-size:45px;
    margin-bottom:15px;
}

h2{
    font-size:35px;
    color:#00ff88;
}

.msg{
    font-size:22px;
    margin-top:15px;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(0.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes tickanim{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.2);
    }
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
    100%{transform:translateY(0);}
}

@keyframes bgmove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
</style>

</head>
<body>

<div class="container">

    <div class="tick">✅</div>

    <h1>Vote Successful</h1>

    <p class="msg">You voted for</p>

    <img src="{{ party.symbol }}" class="party-img">

    <h2>{{ party.name }}</h2>

    <p class="msg">
        Your vote has been recorded successfully 🎉
    </p>

</div>

</body>
</html>
